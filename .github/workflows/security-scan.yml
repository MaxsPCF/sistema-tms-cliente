name: Security Scan - TMS-Cliente

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  # Análisis programado: todos los lunes a las 3:00 AM UTC
  schedule:
    - cron: "0 3 * * 1"

  # Permite ejecución manual desde GitHub UI
  workflow_dispatch:

# Evita ejecuciones duplicadas
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # SAST - CodeQL (Análisis estático de código)
  # ============================================================
  codeql-backend:
    name: CodeQL Analysis - Backend (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write  # Necesario para subir resultados a Security tab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-extended,security-and-quality  # Reglas extendidas
          # Config file opcional para personalizar reglas
          # config-file: ./.github/codeql/codeql-config.yml

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25.0.1"
          check-latest: true
          cache: "maven"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-security-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-security-
            ${{ runner.os }}-maven-

      # CodeQL requiere compilar el código para analizarlo
      - name: Build for CodeQL
        run: mvn -B -T1C -DskipTests compile -f backend/pom.xml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "java-security"
          upload: true

  codeql-frontend:
    name: CodeQL Analysis - Frontend (React/Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # CodeQL analiza el código fuente, no necesita build completo
      # Pero si quieres build completo descomenta:
      # - name: Build frontend
      #   working-directory: frontend
      #   run: npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "javascript-security"
          upload: true

  # ============================================================
  # SCA - Análisis de dependencias vulnerables
  # ============================================================
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Backend: Maven Dependency Check ────────────
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25.0.1"
          cache: "maven"

      - name: Maven Dependency Vulnerability Check
        run: |
          echo "Escaneando dependencias Maven..."
          mvn -B dependency-check:check -f backend/pom.xml \
            -DfailBuildOnCVSS=7 \
            -Dformat=JSON \
            -DprettyPrint=true \
            || echo "Vulnerabilidades encontradas (revisar reporte)"

      - name: Upload Maven dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-dependency-check-report
          path: backend/target/dependency-check-report.json
          retention-days: 30

      # ── Frontend: npm audit ────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: npm Audit Check
        working-directory: frontend
        run: |
          echo "Ejecutando npm audit..."

          # Crear script temporal para manejar exclusiones conocidas
          cat > /tmp/audit-check.js << 'EOF'
          const { execSync } = require('child_process');

          // Vulnerabilidades conocidas sin fix disponible (documentar aquí)
          const KNOWN_EXCEPTIONS = [
            // Ejemplo: 'CVE-2024-xxxxx',  // Descripción y fecha
          ];

          try {
            const output = execSync('npm audit --json', {
              cwd: 'frontend',
              encoding: 'utf8',
              stdio: ['pipe', 'pipe', 'pipe']
            });

            const audit = JSON.parse(output);
            const vulns = audit.vulnerabilities || {};

            let criticalCount = 0;
            let highCount = 0;
            const foundVulns = [];

            for (const [pkg, details] of Object.entries(vulns)) {
              if (details.severity === 'critical') criticalCount++;
              if (details.severity === 'high') highCount++;

              if (['critical', 'high'].includes(details.severity)) {
                const via = (details.via || [])
                  .filter(v => typeof v === 'object' && v.url)
                  .map(v => ({
                    title: v.title,
                    url: v.url,
                    severity: details.severity
                  }));

                foundVulns.push({
                  package: pkg,
                  severity: details.severity,
                  vulnerabilities: via
                });
              }
            }

            console.log(`\nResumen de vulnerabilidades:`);
            console.log(`   Critical: ${criticalCount}`);
            console.log(`   High: ${highCount}`);
            console.log(`   Total moderadas/bajas: ${Object.keys(vulns).length - criticalCount - highCount}`);

            if (foundVulns.length > 0) {
              console.log(`\n Vulnerabilidades HIGH/CRITICAL encontradas:`);
              foundVulns.forEach(v => {
                console.log(`\n   ${v.package} (${v.severity})`);
                v.vulnerabilities.forEach(vuln => {
                  console.log(`      - ${vuln.title}`);
                  console.log(`        ${vuln.url}`);
                });
              });

              // Verificar si todas están en excepciones conocidas
              const allKnown = foundVulns.every(v =>
                v.vulnerabilities.every(vuln =>
                  KNOWN_EXCEPTIONS.some(exc => vuln.url.includes(exc))
                )
              );

              if (!allKnown) {
                console.error('\n ERROR: Vulnerabilidades no documentadas encontradas.');
                console.error('   Si no tienen fix, documéntalas en KNOWN_EXCEPTIONS.');
                process.exit(1);
              }

              console.log('\n Todas las vulnerabilidades están documentadas como excepciones.');
            }

          } catch (error) {
            if (error.status === 1 && error.stdout) {
              // npm audit encontró vulnerabilidades
              console.log(error.stdout);
            }
            console.log('\n  Revisar vulnerabilidades manualmente');
          }
          EOF

          node /tmp/audit-check.js

      - name: Upload npm audit report
        if: always()
        run: |
          npm audit --json > /tmp/npm-audit.json 2>/dev/null || true
        working-directory: frontend

      - name: Save npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: /tmp/npm-audit.json
          retention-days: 30

  # ============================================================
  # SECRET SCANNING - Detección de secretos en código
  # ============================================================
  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesita todo el historial para detectar secretos

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Opcional para features pro
        with:
          # Configuración personalizada (opcional)
          config-path: .gitleaks.toml

      # Alternativa gratuita si no quieres Gitleaks
      # - name: Run truffleHog (backup scanner)
      #   uses: trufflesecurity/trufflehog-action@v1
      #   with:
      #     path: ./

  # ============================================================
  # REPORTE CONSOLIDADO
  # ============================================================
  security-report:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [codeql-backend, codeql-frontend, dependency-scan, secret-scan]
    if: always()  # Siempre ejecuta aunque algún job falle
    timeout-minutes: 5

    steps:
      - name: Generate Security Report
        run: |
          echo "# Security Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # CodeQL Backend
          if [ "${{ needs.codeql-backend.result }}" == "success" ]; then
            echo " **CodeQL (Backend Java)**: Sin vulnerabilidades detectadas" >> $GITHUB_STEP_SUMMARY
          else
            echo " **CodeQL (Backend Java)**: Revisar Security tab para detalles" >> $GITHUB_STEP_SUMMARY
          fi

          # CodeQL Frontend
          if [ "${{ needs.codeql-frontend.result }}" == "success" ]; then
            echo " **CodeQL (Frontend React)**: Sin vulnerabilidades detectadas" >> $GITHUB_STEP_SUMMARY
          else
            echo " **CodeQL (Frontend React)**: Revisar Security tab para detalles" >> $GITHUB_STEP_SUMMARY
          fi

          # Dependency Scan
          if [ "${{ needs.dependency-scan.result }}" == "success" ]; then
            echo " **Dependency Scan**: Sin vulnerabilidades críticas" >> $GITHUB_STEP_SUMMARY
          else
            echo " **Dependency Scan**: Vulnerabilidades encontradas en dependencias" >> $GITHUB_STEP_SUMMARY
          fi

          # Secret Scan
          if [ "${{ needs.secret-scan.result }}" == "success" ]; then
            echo " **Secret Detection**: Sin secretos expuestos" >> $GITHUB_STEP_SUMMARY
          else
            echo " **Secret Detection**: POSIBLES SECRETOS ENCONTRADOS" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo " [Ver Security tab](https://github.com/${{ github.repository }}/security) para análisis detallados." >> $GITHUB_STEP_SUMMARY

      - name: Overall Status
        run: |
          echo "============================================"
          echo "  Security Scan Complete"
          echo "============================================"
          echo ""
          echo "CodeQL Backend:  ${{ needs.codeql-backend.result }}"
          echo "CodeQL Frontend: ${{ needs.codeql-frontend.result }}"
          echo "Dependencies:    ${{ needs.dependency-scan.result }}"
          echo "Secrets:         ${{ needs.secret-scan.result }}"
          echo ""