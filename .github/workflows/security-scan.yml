name: Security Scan - TMS-Cliente
on:
 push:
  branches: [main, master]
  paths:
   - "backend/**"
 pull_request:
  branches: [main, master]
  paths:
   - "backend/**"
 schedule:
  - cron: "0 3 * * 1"

jobs:
 codeql:
  name: CodeQL Scan
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4

   - name: Initialize CodeQL
     uses: github/codeql-action/init@v2
     with:
      languages: java

   - name: Set up JDK 25
     uses: actions/setup-java@v4
     with:
      distribution: "temurin"
      java-version: "25.0.1"
      check-latest: true

   - name: Verify Java and Maven
     run: |
      java -version
      javac -version
      mvn -v

   - name: Build
     run: mvn -B -T1C -DskipTests verify -f backend/pom.xml

   - name: Perform CodeQL Analysis
     uses: github/codeql-action/analyze@v2
