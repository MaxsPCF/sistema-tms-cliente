name: Code Quality - TMS-Cliente
on:
 push:
  branches: [main, master]
  paths:
   - "backend/**"
 pull_request:
  branches: [main, master]
  paths:
   - "backend/**"

jobs:
 backend-quality:
  name: Backend Java Code Quality
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4

   - name: Set up JDK 25
     uses: actions/setup-java@v4
     with:
      distribution: "temurin"
      java-version: "25"
      cache: "maven"

   - name: Cache Maven repository
     uses: actions/cache@v4
     with:
      path: ~/.m2/repository
      key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
      restore-keys: |
       ${{ runner.os }}-m2-

   - name: Build (verify)
     run: mvn -B -T1C -DskipTests verify -f backend/pom.xml

  #  - name: Run tests
  #    run: mvn -B -T1C test -f backend/pom.xml
